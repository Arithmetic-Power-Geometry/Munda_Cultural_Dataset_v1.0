name: MLHKP Publication Build

on:
  workflow_dispatch:
  push:
    branches: [mlhkp-v2]
    paths:
      - 'publication/**'
      - 'data/**'
      - 'software/audit_mundarica_pages.py'
      - 'tests/test_publication_sync.py'
      - '.github/workflows/mlhkp-publication-build.yml'
  pull_request:
    paths:
      - 'publication/**'
      - 'data/**'
      - 'software/audit_mundarica_pages.py'
      - 'tests/test_publication_sync.py'
      - '.github/workflows/mlhkp-publication-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-science biber

      - name: Regenerate repository-derived release metrics
        run: python publication/generate_release_metrics.py

      - name: Enforce publication synchronization contract
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest -q tests/test_publication_sync.py

      - name: Compile manuscript with XeLaTeX and Biber
        working-directory: publication
        run: |
          set -euo pipefail
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          biber main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf

      - name: Fail on unresolved citations or references
        working-directory: publication
        run: |
          set -euo pipefail
          if grep -Eiq 'Citation .* undefined|There were undefined references|Please \(re\)run Biber' main.log; then
            echo 'Unresolved manuscript citation/reference state detected.'
            exit 1
          fi

      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: mlhkp-foundational-manuscript
          path: publication/main.pdf
          if-no-files-found: error
          retention-days: 14
