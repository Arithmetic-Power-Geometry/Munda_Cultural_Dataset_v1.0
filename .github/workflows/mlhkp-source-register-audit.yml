name: MLHKP Source Register Audit

on:
  workflow_dispatch:
  push:
    branches: [mlhkp-v2]
    paths:
      - 'data/sources.csv'
      - 'data/source_register/**'
      - 'data/source_census/**'
      - 'data/source_bundles/encyclopaedia_mundarica/manifest.json'
      - 'docs/mmsc_source_census_protocol.md'
      - 'schemas/source_record.schema.json'
      - 'schemas/master_source_register.schema.json'
      - 'software/validate_master_source_register.py'
      - 'tests/test_master_source_register.py'
      - 'tests/test_mmsc_census.py'
      - '.github/workflows/mlhkp-source-register-audit.yml'
  pull_request:
    paths:
      - 'data/sources.csv'
      - 'data/source_register/**'
      - 'data/source_census/**'
      - 'data/source_bundles/encyclopaedia_mundarica/manifest.json'
      - 'docs/mmsc_source_census_protocol.md'
      - 'schemas/source_record.schema.json'
      - 'schemas/master_source_register.schema.json'
      - 'software/validate_master_source_register.py'
      - 'tests/test_master_source_register.py'
      - 'tests/test_mmsc_census.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pytest

      - name: Validate Master Source Register
        run: python software/validate_master_source_register.py

      - name: Run Master Source Register tests
        run: pytest -q tests/test_master_source_register.py

      - name: Run Master Munda Source Census tests
        run: pytest -q tests/test_mmsc_census.py
